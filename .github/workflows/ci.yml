name: CI

on:
  push:
      branches:
            - main
              pull_request:
                  branches:
                        - main
                          workflow_dispatch:

                          permissions:
                            contents: read

                            jobs:
                              analysis-tests:
                                  name: Analysis tests
                                      runs-on: ubuntu-latest

                                          steps:
                                                - name: Check out repository
                                                        uses: actions/checkout@v4

                                                              - name: Set up Node.js
                                                                      uses: actions/setup-node@v4
                                                                              with:
                                                                                        node-version: 22

                                                                                              - name: Run analysis tests
                                                                                                      run: npm test
                                                                                                      
